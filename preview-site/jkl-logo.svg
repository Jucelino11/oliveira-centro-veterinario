<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
    <!-- Fundo Azul Escuro Arredondado -->
    <rect width="100" height="100" rx="22" fill="#08182E" />
    
    <!-- Letra J (Branco) -->
    <path d="M36 24V63C36 71 30 76 22 74C18 73 16 69 16 66" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Conector Laranja entre J e K -->
    <line x1="36" y1="52" x2="57" y2="52" stroke="#FF7A00" stroke-width="7.5" stroke-linecap="round" />
    
    <!-- Haste Vertical do K (Branco) -->
    <line x1="57" y1="24" x2="57" y2="76" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" />
    
    <!-- Perna Inferior do K (Laranja) -->
    <line x1="57" y1="52" x2="80" y2="75" stroke="#FF7A00" stroke-width="7.5" stroke-linecap="round" />
    
    <!-- Braço Superior do K (Laranja) -->
    <line x1="57" y1="52" x2="77" y2="30" stroke="#FF7A00" stroke-width="7.5" stroke-linecap="round" />
    
    <!-- Ponto / Conexão Superior do K (Laranja) -->
    <circle cx="79" cy="28" r="6.5" fill="#FF7A00" />
</svg>
